media:
  input: public/uploads
  output: /uploads

content:
  - name: pages
    label: Pages
    type: file
    files:
      - name: home
        label: Home Page (الرئيسية)
        path: src/content/pages/home.json
        fields:
          # Hero Section
          - name: hero
            label: Hero Section (القسم الرئيسي)
            type: object
            fields:
              - name: title
                label: Main Headline
                type: string
              - name: subtitle
                label: Subtitle
                type: string
              - name: menuBtnText
                label: Menu Button Text
                type: string
              - name: menuBtnLink
                label: Menu Button Link
                type: string
              - name: whatsappBtnText
                label: WhatsApp Button Text
                type: string
              - name: whatsappNumber
                label: WhatsApp Number
                type: string

          # Best Sellers Section
          - name: bestSellers
            label: Best Sellers (الأكثر مبيعاً)
            type: object
            fields:
              - name: title
                label: Section Title
                type: string
              - name: items
                label: Dishes List
                type: list
                fields:
                  - name: name
                    label: Dish Name
                    type: string
                  - name: image
                    label: Image
                    type: image

          # Locations Section
          - name: locations
            label: Locations Section (ويّنا؟)
            type: object
            fields:
              - name: title
                label: Section Title
                type: string
              - name: subtitle
                label: Subtitle Link Text
                type: string
              - name: branches
                label: Branches List
                type: list
                fields:
                  - name: name
                    label: Branch Name
                    type: string
                  - name: address
                    label: Address Text
                    type: string
                  - name: phone
                    label: Phone Number
                    type: string
                  - name: mapsLink
                    label: Google Maps Link
                    type: string

          # Order Banner Section
          - name: orderBanner
            label: Order Banner (اطّلب هلق)
            type: object
            fields:
              - name: title
                label: Title
                type: string
              - name: btnText
                label: WhatsApp Button Label
                type: string
              - name: whatsappNumber
                label: Phone/WhatsApp Number
                type: string
